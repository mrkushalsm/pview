[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pview"
version = "0.1.0"
description = "A terminal explorer for Linux /proc and system interfaces"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "textual>=0.70",
  "rich>=13.7",
]

[project.scripts]
pview = "pview.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
